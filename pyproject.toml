[project]
name = "rag"
version = "0.1.0"
description = "NexusGraph RAG engine with vector, lexical, and graph retrieval"
readme = "README.md"
authors = [
    { name = "Yusqo Hid", email = "yusqo975@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
